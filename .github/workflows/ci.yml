name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Tests
        run: npm test

      # app/static holds the built interface and is committed — it is what makes
      # the download and the container work without Node. A frontend change that
      # ships without a rebuild is a UI that silently lacks it, which is how three
      # of this project's worst bugs happened.
      - name: The committed bundle matches the source
        run: |
          npm run build
          cd .. && git diff --exit-code --stat app/static \
            || { echo "::error::app/static is stale — run 'npm run build' in frontend/ and commit the result"; exit 1; }
